name: CI

on:
  # This file is in the filter on purpose: without it a CI-only commit never
  # runs CI, so a change to the pipeline could not be verified by the pipeline.
  push:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Scoped to the local-Postgres/multi-brand work (PR1+): the rest of
      # lib/scripts/tests has ~146 pre-existing lint errors and ~98 files
      # with pre-existing format drift, unrelated to this work. Extend this
      # list as each new PR in this initiative adds its own files.
      # scripts/fb_group_scout.py: lint-clean, but has pre-existing (unrelated)
      # ruff-format drift and transitively imports pre-existing mypy-dirty
      # modules (lib/oauth/*, lib/sessions/*) -- included in this list only,
      # not the format-check or mypy lists below.
      # api/oauth_api.py: lint- and format-clean, but also transitively
      # imports lib/oauth/* -- included in both lists here, excluded from
      # the mypy list below for the same reason as fb_group_scout.py.
      # lib/engagement/pipeline.py: lint-clean, but has pre-existing
      # (unrelated) ruff-format drift and transitively imports pre-existing
      # mypy-dirty modules (lib/engagement/history.py, lib/engagement/log.py)
      # -- included in this list only, same as fb_group_scout.py.
      # tests/lib/engagement/test_pipeline.py: same pre-existing ruff-format
      # drift as pipeline.py itself -- lint-list only, not format-check.
      # tests/lib/engagement/_pipeline_fakes.py (its helper module) is clean
      # on both.
      # scripts/wp_scan.py: the fourth SKILL.md-bound flow, but it carries
      # pre-existing (unrelated) ruff-format drift -- excluded from both
      # lists here, while its test (tests/test_wp_scan_skill.py) is clean
      # and included. scripts/fb_comment.py and scripts/ig_comment.py are
      # clean on both and included.
      - name: Ruff check (lint)
        run: >-
          ruff check
          lib/db.py lib/db_pool.py
          lib/groups_db/db.py lib/groups_db/repository.py
          lib/engagements_db/db.py lib/engagements_db/repository.py
          lib/worker_db.py lib/schedule_db.py lib/scheduling/
          lib/errors/platforms.py
          lib/brands_db/ lib/brand_resolver.py
          lib/brand_templates.py lib/brand_template_defaults.py lib/brand_provisioning.py
          lib/comment_generator.py lib/comment_generator_defaults.py lib/reply_drafter.py lib/draft_helper.py lib/draft_prompts.py lib/llm_client.py lib/llm_tracing.py lib/gemini_client.py lib/skill_loader.py
          lib/engagement/adapters/instagram_dom.py lib/engagement/pipeline.py lib/config.py lib/local_env.py lib/flow_readiness.py lib/task_queue.py lib/session_status.py lib/activity_log.py lib/dedup_pg.py lib/bootstrap.py
          scripts/task_dispatcher.py scripts/noop_healthcheck.py scripts/onboard_brand.py scripts/task_worker.py
          scripts/fb_scan.py scripts/ig_engager.py scripts/fb_group_scout.py
          scripts/fb_comment.py scripts/ig_comment.py
          api/brands_api.py api/brand_settings_api.py api/brand_schemas.py api/brand_flows_api.py api/oauth_api.py api/session_status_api.py
          tests/test_db.py tests/test_groups_db.py tests/test_engagements_db.py
          tests/test_worker_db.py tests/test_schedule_db.py tests/test_dedup_pg.py
          tests/lib/engagement/test_pipeline.py tests/lib/engagement/_pipeline_fakes.py
          tests/test_task_dispatcher.py tests/test_task_dispatcher_enabled_flows.py tests/test_task_dispatcher_multi_brand.py
          tests/test_task_worker.py tests/test_task_worker_multi_brand.py tests/lib/scheduling/
          tests/test_brands_db.py tests/test_brands_db_update.py tests/test_brand_resolver.py
          tests/test_brand_templates.py tests/test_brand_provisioning.py tests/test_brand_provisioning_enabled_flows.py
          tests/test_comment_generator.py tests/test_api_brands.py tests/test_api_brands_live.py tests/test_api_brand_settings.py
          tests/test_local_env.py tests/test_flow_readiness.py tests/test_api_brand_flows.py tests/test_task_queue.py tests/test_api_oauth.py
          tests/test_session_status.py tests/test_api_session_status.py tests/test_activity_log.py
          tests/test_reply_drafter.py tests/test_draft_helper.py tests/test_skill_drafter.py tests/test_skill_prompts.py tests/test_llm_client.py tests/test_llm_tracing.py tests/test_gemini_client.py
          tests/test_skill_loader.py tests/test_ig_engager_skill.py tests/test_wp_scan_skill.py
          recipe-publisher/ideator/research.py recipe-publisher/ideator/enricher.py
          recipe-publisher/tests/test_ideator_skill_prompts.py
          lib/crew/products/ scripts/backfill_blog_product_blocks.py
          tests/test_crew_products_pool.py tests/test_crew_products_usage.py
          tests/test_crew_products_stage.py tests/test_crew_products_select.py
          tests/test_crew_products_block.py tests/test_crew_products_blog_backfill.py
          tests/test_backfill_blog_product_blocks.py
          lib/crew/reels/ scripts/crewai_reels_pipeline.py
          tests/test_crew_reels.py tests/test_reels_openart_client.py
          tests/test_ideas_api_reel_transitions.py tests/test_ideas_db_reels.py
          lib/crew/socialpost/ lib/crew/wp_source.py lib/social_post_db.py
          scripts/crewai_social_posts_pipeline.py api/social_posts_api.py
          lib/social_post_slots.py tests/test_social_post_slots.py
          tests/test_crew_socialpost.py tests/test_social_post_db.py
          tests/test_social_posts_api.py
          lib/brand_secrets.py scripts/brand_secrets.py tests/test_brand_secrets.py

      - name: Ruff format check
        run: >-
          ruff format --check
          lib/db.py lib/db_pool.py
          lib/groups_db/db.py lib/groups_db/repository.py
          lib/engagements_db/db.py lib/engagements_db/repository.py
          lib/worker_db.py lib/schedule_db.py lib/scheduling/
          lib/errors/platforms.py
          lib/brands_db/ lib/brand_resolver.py
          lib/brand_templates.py lib/brand_template_defaults.py lib/brand_provisioning.py
          lib/comment_generator.py lib/comment_generator_defaults.py lib/reply_drafter.py lib/draft_helper.py lib/draft_prompts.py lib/llm_client.py lib/llm_tracing.py lib/gemini_client.py lib/skill_loader.py
          lib/engagement/adapters/instagram_dom.py lib/config.py lib/local_env.py lib/flow_readiness.py lib/task_queue.py lib/session_status.py lib/activity_log.py lib/dedup_pg.py lib/bootstrap.py
          scripts/task_dispatcher.py scripts/noop_healthcheck.py scripts/onboard_brand.py scripts/task_worker.py
          scripts/fb_scan.py scripts/ig_engager.py
          scripts/fb_comment.py scripts/ig_comment.py
          api/brands_api.py api/brand_settings_api.py api/brand_schemas.py api/brand_flows_api.py api/oauth_api.py api/session_status_api.py
          tests/test_db.py tests/test_groups_db.py tests/test_engagements_db.py
          tests/test_worker_db.py tests/test_schedule_db.py tests/test_dedup_pg.py
          tests/lib/engagement/_pipeline_fakes.py
          tests/test_task_dispatcher.py tests/test_task_dispatcher_enabled_flows.py tests/test_task_dispatcher_multi_brand.py
          tests/test_task_worker.py tests/test_task_worker_multi_brand.py tests/lib/scheduling/
          tests/test_brands_db.py tests/test_brands_db_update.py tests/test_brand_resolver.py
          tests/test_brand_templates.py tests/test_brand_provisioning.py tests/test_brand_provisioning_enabled_flows.py
          tests/test_comment_generator.py tests/test_api_brands.py tests/test_api_brands_live.py tests/test_api_brand_settings.py
          tests/test_local_env.py tests/test_flow_readiness.py tests/test_api_brand_flows.py tests/test_task_queue.py tests/test_api_oauth.py
          tests/test_session_status.py tests/test_api_session_status.py tests/test_activity_log.py
          tests/test_reply_drafter.py tests/test_draft_helper.py tests/test_skill_drafter.py tests/test_skill_prompts.py tests/test_llm_client.py tests/test_llm_tracing.py tests/test_gemini_client.py
          tests/test_skill_loader.py tests/test_ig_engager_skill.py tests/test_wp_scan_skill.py
          recipe-publisher/ideator/research.py recipe-publisher/ideator/enricher.py
          recipe-publisher/tests/test_ideator_skill_prompts.py
          lib/crew/products/ scripts/backfill_blog_product_blocks.py
          tests/test_crew_products_pool.py tests/test_crew_products_usage.py
          tests/test_crew_products_stage.py tests/test_crew_products_select.py
          tests/test_crew_products_block.py tests/test_crew_products_blog_backfill.py
          tests/test_backfill_blog_product_blocks.py
          lib/crew/socialpost/ lib/crew/wp_source.py lib/social_post_db.py
          scripts/crewai_social_posts_pipeline.py api/social_posts_api.py
          lib/social_post_slots.py tests/test_social_post_slots.py
          tests/test_crew_socialpost.py tests/test_social_post_db.py
          tests/test_social_posts_api.py
          lib/brand_secrets.py scripts/brand_secrets.py tests/test_brand_secrets.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Mypy
        run: >-
          mypy
          lib/db.py lib/db_pool.py
          lib/groups_db/db.py lib/groups_db/repository.py
          lib/engagements_db/db.py lib/engagements_db/repository.py
          lib/worker_db.py lib/schedule_db.py lib/scheduling/
          lib/brands_db/ lib/brand_resolver.py lib/local_env.py lib/flow_readiness.py lib/session_status.py lib/activity_log.py lib/dedup_pg.py lib/bootstrap.py
          lib/brand_templates.py lib/brand_template_defaults.py lib/brand_provisioning.py
          lib/llm_client.py lib/skill_loader.py
          scripts/task_dispatcher.py scripts/noop_healthcheck.py scripts/onboard_brand.py scripts/task_worker.py
          api/brands_api.py api/brand_settings_api.py api/brand_schemas.py api/brand_flows_api.py api/session_status_api.py
          lib/crew/products/ scripts/backfill_blog_product_blocks.py
          lib/crew/reels/ scripts/crewai_reels_pipeline.py
          lib/crew/socialpost/ lib/crew/wp_source.py lib/social_post_db.py
          lib/social_post_slots.py
          scripts/crewai_social_posts_pipeline.py api/social_posts_api.py
          lib/brand_secrets.py scripts/brand_secrets.py
          --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: persona
          POSTGRES_PASSWORD: persona
          POSTGRES_DB: persona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U persona -d persona"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # PR7 (queue-based dispatch): a real Redis backs
      # tests/test_task_dispatcher.py's/test_task_worker.py's/
      # test_api_brand_flows.py's queue-push/pop assertions, not just the
      # Redis-lock fakes those files also use for the due-check lock.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Matches .env.example's DATABASE_URL convention (lib/db_pool.py reads
      # this). Makes the groups_db/engagements_db/worker_db/schedule_db
      # integration tests (tests/test_db.py et al.) run for real here instead
      # of skipping via their requires_postgres skipif guard.
      DATABASE_URL: postgresql://persona:persona@localhost:5432/persona
      # Matches lib/task_queue.py's/scripts/task_dispatcher.py's own default
      # (redis://localhost:6379/0) -- set explicitly for clarity/robustness
      # rather than relying on that default staying in sync with this file.
      REDIS_URL: redis://localhost:6379/0
      # lib/config.py's module-level settings singleton is imported by
      # comment_generator.py/brand_templates.py/brand_provisioning.py and
      # hard-requires a loadable brand config at import time — without this,
      # collecting those test files crashes before any test runs. Points at
      # a generic placeholder brand (tests/fixtures/ci_brand/), built from
      # config.example.json, not any real brand's data.
      BRAND_DIR: ${{ github.workspace }}/app/tests/fixtures/ci_brand
      # tests/test_crew_products_stage.py builds a real crewai Agent to cover
      # the factory. Keep crewai's OpenTelemetry exporter and tracing listener
      # out of the picture so agent construction stays offline and instant --
      # nothing in this suite wants telemetry, and an exporter reaching for the
      # network only adds a way for the job to stall. (This was first added as
      # a suspected fix for the 6h hang; the actual cause was the dotted
      # --cov=lib.crew.products below. Tracing crewai's imports shows zero
      # socket connects, so these are hygiene, not the fix.)
      # (crewai 1.15.12 reads exactly these: telemetry.py checks OTEL_SDK_DISABLED
      # and CREWAI_DISABLE_TELEMETRY; the tracing listener checks CREWAI_TRACING_ENABLED.)
      OTEL_SDK_DISABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
      CREWAI_TRACING_ENABLED: "false"
      # Makes SIGABRT dump every thread's Python stack. Paired with the
      # `timeout --signal=ABRT` wrapper below, so a hang that pytest-timeout
      # structurally cannot see (anything before the first test item) still
      # names itself instead of running to GitHub's 6h ceiling.
      PYTHONFAULTHANDLER: "1"
      # Agent construction resolves the configured provider. No test ever
      # performs a completion (crewai is faked at the Crew.kickoff boundary),
      # so this is a placeholder purely to keep provider setup from stalling.
      DEEPSEEK_API_KEY: ci-placeholder-never-called
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Apply Postgres schema
        run: psql "$DATABASE_URL" -f db/schema.sql

      - name: Run tests with coverage
        # Scoped to the local-Postgres/multi-brand work (PR1+), not the full
        # suite: ~41 pre-existing, unrelated tests fail today (mostly
        # recipes_db/Supabase-dependent tests with no creds in CI, plus a
        # handful of unrelated failures in rate_limiter/campaigns/comment_generator).
        # Fixing those is a separate, unplanned, out-of-scope effort. Extend
        # this list as each new PR in this initiative adds its own tests.
        # test_persona_url_rejected is deselected: it hardcodes the literal
        # placeholder string "your-brand.com" as the URL validate_voice should
        # reject, but the check reads the real settings.site.url
        # (dogfoodandfun.com) — never matched, confirmed failing identically
        # before this PR's changes too (pre-existing, unrelated fixture bug).
        # --cov=lib/crew/products is a PATH, deliberately not the dotted
        # `lib.crew.products`. pytest-cov hands a dotted source to coverage,
        # which resolves it by IMPORTING the package inside pytest_configure --
        # before the session header, before collection, before any test exists.
        # That import runs lib/crew/__init__.py, which eagerly pulls
        # lib.crew.scout -> crewai -> chromadb/numpy, and on this runner it
        # never returns: three runs (16m, 33m, 6h) logged not one byte of
        # pytest output. The path form makes coverage measure files by path and
        # never import them. Keep it a path for any heavy package added here.
        # `timeout --signal=ABRT 600` is the outer net: --timeout below only
        # arms a timer per test item (setup/call/teardown), so any hang before
        # the first test -- plugin load, coverage's source resolution, conftest
        # import, collection -- is invisible to it. SIGABRT + PYTHONFAULTHANDLER
        # turns such a hang into an all-thread traceback within 10 minutes
        # instead of a 6h cancellation with an empty log.
        run: |
          timeout --signal=ABRT 600 pytest \
            --timeout=90 --timeout-method=thread \
            tests/test_db.py \
            tests/test_groups_db.py \
            tests/test_engagements_db.py \
            tests/test_worker_db.py \
            tests/test_schedule_db.py \
            tests/test_dedup_pg.py \
            tests/test_task_dispatcher.py \
            tests/test_task_dispatcher_enabled_flows.py \
            tests/test_task_dispatcher_multi_brand.py \
            tests/test_task_worker.py \
            tests/test_task_worker_multi_brand.py \
            tests/lib/scheduling/ \
            tests/test_brands_db.py \
            tests/test_brands_db_update.py \
            tests/test_brand_resolver.py \
            tests/test_brand_templates.py \
            tests/test_brand_provisioning.py \
            tests/test_brand_provisioning_enabled_flows.py \
            tests/test_comment_generator.py \
            tests/test_api_brands.py \
            tests/test_api_brands_live.py \
            tests/test_api_brand_settings.py \
            tests/test_api_brand_flows.py \
            tests/test_local_env.py \
            tests/test_flow_readiness.py \
            tests/test_task_queue.py \
            tests/test_api_oauth.py \
            tests/test_session_status.py \
            tests/test_api_session_status.py \
            tests/test_activity_log.py \
            tests/lib/engagement/test_pipeline.py \
            tests/test_reply_drafter.py \
            tests/test_draft_helper.py \
            tests/test_llm_tracing.py \
            tests/test_gemini_client.py \
            tests/test_crew_products_pool.py \
            tests/test_crew_products_usage.py \
            tests/test_crew_products_stage.py \
            tests/test_crew_products_select.py \
            tests/test_crew_products_block.py \
            tests/test_crew_products_blog_backfill.py \
            tests/test_backfill_blog_product_blocks.py \
            tests/test_crew_reels.py \
            tests/test_reels_openart_client.py \
            tests/test_ideas_api_reel_transitions.py \
            tests/test_ideas_db_reels.py \
            tests/test_crew_socialpost.py \
            tests/test_social_post_db.py \
            tests/test_social_post_slots.py \
            tests/test_social_posts_api.py \
            tests/test_brand_secrets.py \
            --deselect tests/test_comment_generator.py::TestValidateVoice::test_persona_url_rejected \
            --cov=lib.db --cov=lib.db_pool --cov=lib.groups_db \
            --cov=lib.engagements_db --cov=lib.worker_db --cov=lib.schedule_db --cov=lib.dedup_pg \
            --cov=lib.scheduling \
            --cov=lib.brands_db --cov=lib.brand_resolver --cov=lib.local_env --cov=lib.flow_readiness --cov=lib.session_status --cov=lib.activity_log \
            --cov=lib.brand_templates --cov=lib.brand_template_defaults --cov=lib.brand_provisioning \
            --cov=comment_generator --cov=comment_generator_defaults --cov=reply_drafter --cov=draft_helper --cov=llm_tracing --cov=gemini_client \
            --cov=api.brands_api --cov=api.brand_settings_api --cov=api.brand_schemas --cov=api.brand_flows_api \
            --cov=api.oauth_api --cov=api.session_status_api \
            --cov=lib/crew/products \
            --cov-report=term-missing --cov-fail-under=80

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for secrets in code
        run: |
          # Fail if bot tokens or credentials are committed
          if grep -rn "bot_token.*:" lib/ scripts/ tests/ --include="*.py" | grep -v "_config\|config_file\|cfg\|environ\|get("; then
            echo "ERROR: Possible hardcoded credentials found"
            exit 1
          fi
          echo "No hardcoded credentials found"

      - name: Check for dangerous patterns
        run: |
          # Fail if eval() or exec() are used (excludes Playwright's
          # page.evaluate and the Redis client's r.eval(), a Lua-script
          # call unrelated to Python's eval() builtin)
          if grep -rn "eval(\|exec(" lib/ scripts/ --include="*.py" | grep -v "page.evaluate\|#.*eval\|r\.eval\|redis.*\.eval("; then
            echo "ERROR: Dangerous eval/exec usage found"
            exit 1
          fi
          echo "No dangerous patterns found"

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Lint
        run: npm run lint
